[project]
name = "mtglang"
version = "0.1.0"
description = "Language-independent notation for Magic: The Gathering card text"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "lark>=1.3.1",
    "pyyaml>=6.0.4",
]

[project.scripts]
mtglang = "mtglang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtglang"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
