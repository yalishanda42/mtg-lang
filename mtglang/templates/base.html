<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{% block title %}MTG-Lang{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Symbols 2", "Segoe UI Symbol", sans-serif;
         font-size: 16px; margin: 2rem auto; max-width: 1200px; padding: 0 1rem; color: #1d1d1f; background: #fafafa; }
  nav a { margin-right: 1rem; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .card h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .hdr { font-size: 1.1rem; margin: .15rem 0; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  td, th { border-top: 1px solid #eee; padding: .35rem .5rem; vertical-align: top; text-align: left; }
  th { font-size: .8rem; text-transform: uppercase; color: #666; }
  td.n { font-size: 1.15rem; width: 38%; }
  td.a { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; color: #444; width: 27%; }
  td.o { color: #333; }
  .sym { cursor: help; }
  .name { color: #0b5394; cursor: help; }
  .effect { color: #8e44ad; cursor: help; }
  .mana { color: #7a5c00; }
  img.ms { height: 1em; width: 1em; vertical-align: -0.12em; margin: 0 1px; }
  .bad { background: #fde2e2; }
  .issues { color: #b00020; font-size: .9rem; margin-top: .5rem; white-space: pre-wrap; }
  .legend td.g { font-size: 1.3rem; }
</style>
</head>
<body>
<nav><a href="index.html">Index</a><a href="legend.html">Legend</a>{% for s in sets %}<a href="{{ s.code }}.html">{{ s.code }}</a>{% endfor %}</nav>
{% block body %}{% endblock %}
</body>
</html>
